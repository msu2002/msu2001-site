<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>برق القمر الصناعي MTG</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
html,body,#m{height:100%;margin:0;background:#0a1a12}
.dark-base{filter:invert(1) hue-rotate(180deg) brightness(.78) contrast(.92) saturate(.55)}
#n{position:absolute;z-index:1000;bottom:64px;inset-inline:10px;background:rgba(8,19,11,.86);color:#f0ead8;border:1px solid rgba(232,200,122,.35);border-radius:12px;padding:8px 12px;font:12.5px/1.7 system-ui,sans-serif}
#n b{color:#e8c87a}
</style>
</head>
<body>
<div id="m"></div>
<div id="n"><b>برق القمر الصناعي MTG</b> · مساحات الوميض المتراكمة من راصد البرق (EUMETSAT) · <span id="t">جارٍ التحميل…</span><br>رصد من الفضاء يتأخر نحو ربع ساعة وليس تحذيرًا رسميًا. المرجع المركز الوطني للأرصاد.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";
var p=(location.hash||"").slice(1).split(","),lat=parseFloat(p[0]),lon=parseFloat(p[1]);
if(!isFinite(lat)||!isFinite(lon)){lat=25.8688;lon=43.4988}
var map=L.map("m",{minZoom:4,maxZoom:9}).setView([lat,lon],6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© مساهمو OpenStreetMap",maxZoom:19,className:"dark-base"}).addTo(map);
var li=L.tileLayer.wms("https://view.eumetsat.int/geoserver/ows",{layers:"mtg_fd:li_afa",format:"image/png",transparent:true,version:"1.3.0",opacity:.85,attribution:'<a href="https://view.eumetsat.int/" target="_blank" rel="noopener">EUMETSAT</a>'}).addTo(map);
[25000,50000,100000].forEach(function(r){L.circle([lat,lon],{radius:r,color:"#e8c87a",weight:1,opacity:.55,dashArray:"4 6",fill:false,interactive:false}).addTo(map)});
L.circleMarker([lat,lon],{radius:7,color:"#08130b",weight:3,fillColor:"#e8c87a",fillOpacity:1}).addTo(map);
var fmt=new Intl.DateTimeFormat("ar-SA-u-ca-gregory",{timeZone:"Asia/Riyadh",hour:"numeric",minute:"2-digit"});
function stamp(){document.getElementById("t").textContent="آخر تحديث للخريطة "+fmt.format(new Date())+" · يتجدد كل ٥ دقائق"}
li.on("load",stamp);
li.on("tileerror",function(){document.getElementById("t").textContent="تعذّر تحميل طبقة البرق الآن"});
setInterval(function(){if(!document.hidden)li.setParams({_t:Date.now()})},5*60*1000);
})();
</script>
</body>
</html>
