"ارتباط موقعها ببطولات يوم كزاز التاريخي الشهير في الجاهلية","منازل لقبائل عربية عريقة أثرت الفصاحة والشعر العربي"],poetrySnippet:{poet:"زهير بن أبي سلمى (المعلقة)",verse:"بَكَرْنَ هُزَيْلاً وَاسْتَقَلَّتْ بِهِمْ ضُحىً ... فَهُنَّ لِوَادِي الرَّسِّ كَالْيَدِ لِلْفَمِ",context:"يصف الشاعر ورود القوافل والظعائن إلى وادي الرّس لكرم مائه ووفرة رعيه وخصوبة أرضه."}},{id:"islamic-era",eraName:"العصور الإسلامية المبكرة",period:"القرن الأول إلى القرن التاسع الهجري",summary:"ظلت الرس محطة مهمة على دروب الحج والتجارة القادمة من البصرة وشرق الجزيرة عبر نجد نحو مكة المكرمة والمدينة المنورة.",details:"استمرت عيون الرس ومزارعها كمحطة تزود للقوافل والحجاج المارين بطريق الحج البصري ودرب زبيدة الشهير، مما جعلها واحة نخيل دائمة الخضرة في قلب القصيم تحاط بالروابي والجبال الشاهقة كجبال أبانين.",highlights:["محطة حيوية على طرق القوافل المتجهة للمشاعر المقدسة","امتداد البساتين ومزارع النخيل ومنابع المياه الجوفية العذبة","استقرار مجتمعات زراعية وتجارية متوارثة الجيل بعد الجيل"]},{id:"modern-founding",eraName:"إعادة إعمار وتأسيس البلدة الحديثة",period:"قرابة عام 900 هـ (1495م)",summary:"انطلقت مرحلة البناء والاستقرار الحضري الحديث للرس بنزول الأسر الكريمة واستصلاح الأراضي وبناء الأسوار والمزارع والقلاع.",details:"شهدت هذه المرحلة تأسيس بلدة الرس بنسيجها المعماري النجدي المتقن؛ حيث بُنيت البيوت الطينية ذات الأفنية والواحات المحاطة بأسوار دفاعية منيعة لصد الغارات، وتشكلت نواة المجتمع الحاضر الذي تميز بالكرم والفروسية والتجارة وعمارة المساجد.",highlights:["تأسيس النسيج العمراني الطيني النجدي المتميز","بناء المساجد وحلقات الكتاتيب لتعليم القرآن الكريم","اتساع زراعة النخيل وتجارة التمور والقمح","تشييد القلاع والحصون لحماية الأهالي والمزارع"]},{id:"battle-of-rass",eraName:"ملحمة الصمود التاريخية (معركة وحصار الرس)",period:"1232 هـ - 1233 هـ (1817م)",summary:"ملحمة وطنية خالدة استبسل فيها أهالي الرس بقيادة الشيخ قرناس بن عبدالرحمن والأمير منصور العساف في صد جيش إبراهيم باشا لمدة 105 أيام، وأجبروه على توقيع صلح مشرّف.",details:"حاصر إبراهيم باشا بلدة الرس بقوات ضخمة وعتاد عسكري حديث ومدافع ثقيلة بعد خضوع العديد من البلدات. استمر الحصار لثلاثة أشهر ونصف، وضرب أهالي الرس رجالاً ونساءً أروع أمثلة التضحية والذكاء العسكري؛ ومن ذلك اكتشاف نفق البارود الذي حفره جيش الباشا لتفجير السور بواسطة امرأة فطنة سمعت صوت الحفر تحت دارها، فأحبط الأهالي الخطة وصبوا عليهم النار والكبريت. تكبد الغزاة خسائر فادحة (نحو 1500 قتيل)، واضطر الباشا لطلب الصلح ورفع الحصار دون دخول البلدة.",highlights:["صمود أسطوري استمر 105 أيام في وجه أضخم جيوش العصر","حنكة وشجاعة القاضي الشيخ قرناس بن عبدالرحمن في قيادة المقاومة والتفاوض","اكتشاف نفق البارود وبسالة المرأة والأهالي في إحباط تفجير السور","إجبار قائد الحملة على توقيع الصلح المشرف ورفع الحصار","تخليد برج الشنانة كشاهد تاريخي شامخ صمد أمام قذائف المدافع"],poetrySnippet:{poet:"شعر نبطي متوارث عن صمود الرس",verse:"يا دارنا عِزّك على الطود راسي ... يحميك رب البيت والجمع صامد",context:"تخليد لثبات أهالي الرس وأسوارها أمام غارات وحصار جيوش إبراهيم باشا."}},{id:"saudi-unification-present",eraName:"العهد السعودي المبارك ورؤية 2030",period:"من توحيد المملكة على يد الملك عبدالعزيز إلى اليوم",summary:"تحولت محافظة الرس إلى ثالث أكبر مدن منطقة القصيم وعاصمة للتعليم والرياضة والتراث العريق ومشاريع النهضة الحديثة.",details:"شهدت الرس في العهد السعودي المبارك نهضة تنموية شاملة؛ فافتتحت المدارس النظامية ابتداءً من المدرسة السعودية عام 1363هـ، وتلتها المدرسة العسكرية، وتأسست كليات جامعة القصيم، وتألقت أنديتها الرياضية، ورُمم برج الشنانة والمواقع التراثية ضمن مستهدفات رؤية السعودية 2030.",highlights:["افتتاح بواكير التعليم النظامي بالمنطقة","ترميم برج الشنانة وتطوير محيطه التراثي السياحي","مدينة الرياضة مع أندية الحزم والخلود التاريخية","نهضة صناعية وزراعية وتوسع في البنية التحتية والمرافق الأكاديمية"]}],QE=[{id:"shenana-tower",nameAr:"برج الشنانة التاريخي",nameEn:"Shenana Historic Tower",constructionDate:"أوائل القرن الثاني عشر الهجري (حوالي 1208هـ / 1793م)",heightOrSize:"ارتفاع يقارب 27 متراً",category:"دفاعي حربي",image:"https://images.unsplash.com/photo-1590402494682-cd3fb53b1f70?auto=format&fit=crop&w=1200&q=80",brief:"أيقونة التراث الحربي والمعماري في منطقة القصيم، شُيد لأغراض الاستطلاع والمراقبة، وشهد أشرس معارك الدفاع عن نجد وصمد أمام مدافع إبراهيم باشا.",deepDescription:"يقع برج الشنانة في بلدة الشنانة التاريخية جنوب غربي الرس بحوالي 7 كم. شُيّد البرج من الطين الممزوج بالتبن ويتخذ شكلاً مخروطياً يضيق كلما ارتفع إلى الأعلى. يتكون من عدة طوابق تشتمل على فتحات مخصصة للرماة والمراقبة (مزاغل)، وتحيط به أحزمة جصية هندسية تمنع تآكل الطين وتكسبه مهابة بصرية. خضع البرج لعدة عمليات ترميم وطنية بالغة الدقة كان أحدثها بإشراف هيئة التراث ليظل منارة للأجيال.",historicalSignificance:"صموده أمام نيران المدافع في حصار الرس عام 1232هـ، ووقوفه شاهداً على شجاعة أهالي الرس والشنانة وتضحياتهم دفاعاً عن أرضهم.",features:["تصميم هندسي مخروطي بارتفاع 27 متراً","حوائط طينية متراصة مقاومة للحرارة والقذائف","مزاغل رماية وفتحات تهوية واستطلاع محكمة","محيط تراثي يضم بقايا آبار ومنازل الشنانة القديمة"]},{id:"marifaq-castle",nameAr:"قلعة وقصر مريفق التراثي",nameEn:"Marifaq Heritage Castle & Palace",constructionDate:"أكثر من قرنين من الزمان",category:"معماري تراثي",image:"https://images.unsplash.com/photo-1578328819058-b69f3a3b0f6b?auto=format&fit=crop&w=1200&q=80",brief:"قصر تاريخي وحصن دفاعي يجسد روعة البناء النجدي التراثي باللبن وجذوع الأثل وعسيب النخل.",deepDescription:"يمثل قصر وقلعة مريفق بالرس نموذجاً أصيلاً للعمارة النجدية التقليدية؛ حيث يحتوي على قاعات لاستقبال الضيوف (المشراق والمجلس)، وغرف تخزين التمور والمحاصيل، وأبراج مراقبة مصغرة. كان مقراً للضيافة وإدارة شؤون الأهالي ونقطة حصينة خلال الفترات التاريخية.",historicalSignificance:"شاهد على نمط الإدارة المحلية والترابط الاجتماعي والكرم الحاتمي لأهالي الرس.",features:["بناء طيني متكامل محاط بسور وبوابات خشبية سميكة","أعمدة اسطوانية (خرزات) ترفع الأسقف المزينة بنقوش نجدية","أقسام مخصصة لضيافة القوافل والمسافرين"]},{id:"pasha-tunnel",nameAr:"نفق إبراهيم باشا التاريخي",nameEn:"Ibrahim Pasha Siege Tunnel",constructionDate:"1232 هـ (1817م)",category:"أثري تاريخي",image:"https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1200&q=80",brief:"أثر تاريخي يوثق النفق السري الذي حفره المهاجمون لنسف سور الرس بالبارود وكشفته نباهة امرأة من أهل البلدة.",deepDescription:"أثناء حصار الرس، أمر إبراهيم باشا جنوده بحفر سرداب تحت الأرض ينفذ إلى أسفل سور الرس لوضع كميات هائلة من البارود ونسفه بعد عجز المدافع عن إسقاطه. وبينما كانت امرأة من نساء الرس تطحن الحبوب في دارها ليلاً، سمعت صوت قرع الفؤوس والحفر تحت الأرض، فأبلغت قادة الدفاع على الفور. قام الأهالي بحفر خندق معاكس ونزلوا إليه وصبوا الكبريت المشتعل والمياه على الغزاة فأفشلوا الهجوم.",historicalSignificance:"أحد أشهر الشواهد الأثرية على دهاء ومقاومة أهالي الرس وبسالة المرأة السعودية في التاريخ الوطني.",features:["أطلال النفق والخندق المقابل الشاهد على الواقعة","موقع موثق في كتب الرحالة والمؤرخين (كابن بشر وابن عيسى)","محطة للباحثين والزوار في سيرة معركة الرس"]},{id:"wadi-alrummah",nameAr:"وادي الرُّمة وبساتين النخيل",nameEn:"Wadi Al-Rummah Valley & Palm Oases",constructionDate:"تكوين طبيعي ضارب في القدم",category:"طبيعي وجغرافي",image:"https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=1200&q=80",brief:"شريان الحياة وأطول أودية الجزيرة العربية (يقارب 600 كم)، يمر شمال الرس ويمنحها مياهاً جوفية غزيرة ومزارع نخيل باسقة.",deepDescription:"يمثل وادي الرمة أعظم ظاهرة جيومورفولوجية في شبه الجزيرة العربية. تقع الرس في حوضه الخصيب، مما جعلها واحة استقرار زراعي عبر القرون، وتشتهر بنخيلها وإنتاج أفخر أنواع التمور (السكري، البرحي، والونانة)، وتشكل جريان مياهه عند هطول الأمطار موسماً احتفالياً شعبياً لأهالي القصيم والمملكة.",historicalSignificance:"السبب الجوهري في استدامة الحياة والاستقرار الحضري بالرس ومحيطها منذ عصور ما قبل الإسلام.",features:["أطول وادٍ في شبه الجزيرة العربية يمتد من حرة خيبر حتى صحراء الدهناء","تربة خصبة ومخزون مياه جوفية عذبة","بساتين نخيل عريقة تنتج مئات الأطنان من التمور الفاخرة"]},{id:"ancient-wall-gates",nameAr:"سور الرس القديم وبواباته التاريخية",nameEn:"Ancient Rass Wall & Gates",constructionDate:"القرن الثاني عشر الهجري",category:"دفاعي حربي",image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80",brief:"السور الدفاعي الذي طوق بلدة الرس واحتوى على مقاصير وأبراج مراقبة وبوابات رئيسية كباب النقبة وباب القصر.",deepDescription:"كان لسور الرس القديم دور حاسم في تحصين البلدة؛ حيث بني بطبقات متينة من الطين وجذوع النخيل، ودُعم بخندق خارجي ومقصورات دفاعية. وكان للبلدة بوابات مشهورة تفتح نهاراً لدخول المزارعين والمسافرين وتغلق ليلاً لتأمين المجتمع.",historicalSignificance:"رمز لمنعة البلدة وتنظيمها الدفاعي المحكم على مر الأزمات التاريخية.",features:["بوابات خشبية عتيقة من أخشاب الأثل والحديد المطروق","أبراج مقاصير للمراقبة والرمي عند أركان السور","خندق مائي جاف كان يحفر حول السور لعرقلة الخيالة"]}],KE=[{yearH:"1200 - 1362 هـ",yearG:"1785 - 1943 م",title:"عهد الكتاتيب وحلقات المساجد بالرس",description:"اعتمد التعليم على الكتاتيب في بيوت المشايخ ومساجد الرس العتيقة، لتعليم تلاوة القرآن الكريم وحفظه، ومبادئ الفقه والحديث والخط والحساب والأدب العربي.",impact:"تخريج جيل من العلماء والقضاة والشعراء، كان في مقدمتهم الشيخ قرناس بن عبدالرحمن قاضي الرس والقصيم.",badge:"الأصول والتأسيس"},{yearH:"1363 هـ",yearG:"1944 م",title:"افتتاح أول مدرسة نظامية (المدرسة السعودية بالرس)",description:"تأسست المدرسة السعودية للبنين في 8 شوال 1363هـ بأمر سامٍ كريم في عهد الملك المؤسس عبدالعزيز آل سعود طيب الله ثراه، لتكون انطلاقة العصر التعليمي الحديث.",impact:"نقل التعليم من الفردية إلى المؤسسية وفق مناهج دراسية معتمدة ورعاية حكومية متكاملة.",badge:"بداية التعليم النظامي"},{yearH:"1374 هـ",yearG:"1954 م",title:"تأسيس المدرسة العسكرية بالرس",description:"أنشئت المدرسة العسكرية بمبادرة وطنية تاريخية شارك فيها الشيخ حمد بن منصور المالك، لتدريب وتعليم أبناء الرس علوم الانضباط والخدمة الوطنية.",impact:"إمداد القطاعات العسكرية والأمنية بالدولة بنخبة من الضباط والقادة البواسل.",badge:"الريادة والانضباط"},{yearH:"1400 - 1445 هـ",yearG:"1980 - 2024 م",title:"تطور إدارة التعليم بالرس وكليات الجامعة",description:"توسع مظلة إدارة التعليم بمحافظة الرس لتشمل مئات المدارس ومراكز الموهوبين والتدريب التربوي، وافتتاح مجمع كليات جامعة القصيم بالرس للبنين والبنات.",impact:"تحول الرس إلى قطب أكاديمي وتعليمي متطور يواكب الثورة الرقمية ومستهدفات رؤية 2030.",badge:"الريادة المعاصرة"}],Zn=[][0],ZE=[{id:"sheikh-qarnas",name:"الشيخ قرناس بن عبدالرحمن المحفوظي العجمي",title:"قاضي الرس والقصيم وقائد ملحمة الصمود (1190 - 1262 هـ)",era:"الدولة السعودية الأولى والدولة السعودية الثانية",bio:"ولد في بلدة صبيح وتفقه على كبار علماء عصره، ثم عُيّن قاضياً للرس وعموم بلدان القصيم. قاد المقاومة العسكرية والشعبية لأهالي الرس إبان حصار إبراهيم باشا عام 1232هـ بعد إصابة أمير البلدة، وجمع بين الشجاعة العسكرية الباسلة والحكمة الفقهية والسياسية في إدارة المفاوضات وفرض شروط الصلح.",legacy:'رمز تاريخي للصمود والعدل؛ خُلّد ذكره في تاريخ الجزيرة العربية، ويُعد "نقش قرناس" بجبل أبانين وثيقة تاريخية بارزة للأحداث.'},{id:"emir-mansur-assaf",name:"الأمير منصور بن عساف",title:"أمير الرس إبان معركة وحصار إبراهيم باشا",era:"الدولة السعودية الأولى",bio:"أمير الرس الذي قاد الدفاع الأولي ونسّق التحصينات وبناء المتاريس وتوزيع الرماة على أسوار وأبراج البلدة. أصيب خلال المعارك بجراح بليغة واستمر في مؤازرة أهالي بلدته حتى تحقق النصر ورفع الحصار.",legacy:"نموذج في القيادة والفروسية والتضحية دفاعاً عن الأهل والوطن."},{id:"sheikh-mohammed-blaihed",name:"الشيخ العلامة محمد بن عبدالله بن بليهد",title:"مؤرخ وجغرافي الجزيرة العربية وصاحب «صحيح الأخبار»",era:"عهد الملك عبدالعزيز (توفي 1377هـ / 1957م)",bio:'أحد كبار رواد التاريخ والجغرافيا النجدية، قضى شطراً واسعاً من حياته في تحقيق مواضع وأودية وجبال وبلدان الجزيرة العربية وتطابقها مع الشعر الجاهلي والإسلامي، وألف معجمه الخالد "صحيح الأخبار عما في بلاد العرب من الآثار".',legacy:"مرجع أول لعلماء الجغرافيا والتاريخ وأحد أعلام الرس الذين أثروا المكتبة العربية."},{id:"sheikh-hamad-malek",name:"الشيخ حمد بن منصور المالك",title:"رائد التعليم ومؤسس المدرسة العسكرية بالرس",era:"القرن الرابع عشر الهجري",bio:"من أعيان ورجالات الرس البارزين، كان له الفضل الكبير في السعي لتأسيس المدرسة العسكرية بالرس عام 1374هـ لدعم التعليم والانضباط العسكري لأبناء المنطقة، وشارك في العديد من المبادرات التنموية والخيرية.",legacy:"بصمة رائدة في تحديث التعليم وتوجيه شباب الرس نحو خدمة الوطن في ا العربية السعودية.",'اكتشاف النفط عام 1938م (بئر الدمام رقم 7 "بئر الخير") وانطلاق عصر التحديث الشامل مع الحفاظ على التراث والأصالة.'],keyFiguresOrKings:["الملك المؤسس عبدالعزيز بن عبدالرحمن آل سعود","الملوك الأبناء: سعود، فيصل، خالد، فهد، عبدالله رحمهم الله"],historicalSites:["قصر المصمك بالرياض","قصر المربع","قصر خزام بجدة","قصر السقاف بمكة","بئر الدمام رقم 7"],civilizationImpact:"صناعة أكبر وأرسخ وحدة وطنية استراتيجية في تاريخ الشرق الأوسط الحديث ونقل المجتمع إلى مصاف الدول المتقدمة.",badge:"1932م"},{id:"vision-2030",period:"العهد الزاهر ورؤية السعودية 2030 (2016م - المستقبل)",nameAr:"عصر النهضة الشاملة ومستقبل الحضارة (رؤية 2030)",nameEn:"Vision 2030 & Future Civilization",dateRange:"2016م - المستقبل",tagline:"عمق عربي وإسلامي، قوة استثمارية رائدة، ومحور ربط القارات الثلاث",summary:"بقيادة خادم الحرمين الشريفين الملك سلمان بن عبدالعزيز، ورؤية وإشراف صاحب السمو الملكي الأمير محمد بن سلمان ولي العهد رئيس مجلس الوزراء، تعيش المملكة نهضة حضارية غير مسبوقة تصنع المستقبل وتعتز بالتراث.",highlights:["مشاريع التحول الثقافي والتراثي الكبرى: الدرعية بوابة التاريخ، تطوير العلا، القدية، آرت رياض.","مشاريع المستقبل الطموحة: نيوم وذا لاين وسندالة، البحر الأحمر، أمالا، السودة، وروشن.","مبادرة السعودية الخضراء والشرق الأوسط الأخضر لمكافحة التصحر وحماية التنوع الأحيائي.","الفوز التاريخي باستضافة إكسبو 2030 في الرياض واستضافة كأس العالم 2034، وريادة الاقتصاد الرقمي والذكاء الاصطناعي."],keyFiguresOrKings:["خادم الحرمين الشريفين الملك سلمان بن عبدالعزيز","صاحب السمو الملكي الأمير محمد بن سلمان بن عبدالعزيز ولي العهد رئيس مجلس الوزراء"],historicalSites:["مشروع الدرعية التراثي العالمي","وادي الفن والعلا العالمية","جزيرة سندالة ونيوم","وجهة البحر الأحمر الدولية"],civilizationImpact:"إعادة تقديم الهوية السعودية كمنارة حضارية عالمية ملهمة تمزج أحدث تقنيات المستقبل بعمق 9000 عام من الإرث الإنساني الأصيل.",badge:"رؤية 2030"}],f8=[{id:"hegra",nameAr:"الحِجر (مدائن صالح)",nameEn:"Hegra Archeological Site",region:"منطقة المدينة المنورة (محافظة العلا)",inscribedYear:2008,category:"ثقافي",brief:"أول موقع سعودي يدرج في قائمة اليونسكو للتراث العالمي، وهو العاصمة الجنوبية لمملكة الأنباط الشهيرة بواجهاتها المنحوتة في الصخر.",deepDescription:'يضم الحجر أكثر من 111 مقبرة ضخمة ذات واجهات أثرية متقنة نُحتت مباشرة في الجبال الرملية خلال الفترة من القرن الأول قبل الميلاد وحتى القرن الأول الميلادي. تبرز في الموقع مقبرة "قصر الفريد" الأيقونية، بالإضافة إلى النقوش الديدانية والنبطية والآبار والقنوات المائية الهندسية المبتكرة التي دلت على براعة فائقة في استغلال الموارد المائية في قلب الصحراء.',significance:["أول موقع تراث عالمي في المملكة العربية السعودية (2008م).","أكبر موقع محفوظ لحضارة الأنباط جنوب البتراء.","يحتوي على نقوش بلغات متعددة توثق النشاط التجاري والاجتماعي لطريق البخور.","شاهد استثنائي على التفاعل بين الثقافات الهلنستية والرومانية والشرقية."],historicalEra:"مملكة الأنباط (القرن 1 ق.م - 106م)",locationCoord:{lat:26.8044,lng:37.9547},features:["قصر الفريد","قصر البنت","جبل إثلب ومحف الريوان","الآبار النبطية الـ 50","النقوش التذكارية"],image:"https://images.unsplash.com/photo-1586861203927-802315b9e595?auto=format&fit=crop&w=1200&q=80",curatorNote:"يمثل قصر الفريد قمة النحت النبطي المنفرد بصخرة كاملة لم تكتمل واجهتها السفلية مما يعطي علماء الآثار درساً حياً في تقنيات النحت الصخري القديمة."},{id:"at-turaif",nameAr:"حي الطريف بالدرعية",nameEn:"At-Turaif District in Diriyah",region:"منطقة الرياض (الدرعية)",inscribedYear:2010,category:"ثقافي",brief:"مهد الدولة السعودية الأولى وعاصمتها التاريخية، ونموذج بارز وفذ للعمارة النجدية المبنية من الطين واللبن.",deepDescription:"يقع حي الطريف فوق هضبة مطلة على وادي حنيفة الخصب، وشكل المقر الرئيس لحكم أئمة الدولة السعودية الأولى في القرن الثامن عشر والتاسع عشر. يضم الحي قصر سلوى الضخم الذي تبلغ مساحته أكثر من 10,000 متر مربع، وقصر الإمام تركي بن عبدالله، وقصر عمر بن سعود، إلى جانب المساجد التاريخية والأبراج الدفاعية والأسواق وحمامات البخار التقليدية ونظام تصريف المياه.",significance:["شاهد حي على ولادة الدولة السعودية عام 1744م وإشعاعها الفكري والسياسي.","أبرز وأضخم مجمع مبني بالطين اللبن وفق الطراز المعماري النجدي المتميز بفتحاته المثلثية وشرفاته العلوية.","محور استراتيجي لمشروع بوابة الدرعية الاستثماري العالمي بقيمة تتجاوز 60 مليار دولار."],historicalEra:"الدولة السعودية الأولى (1744 - 1818م)",locationCoord:{lat:24.7335,lng:46.5746},features:["قصر سلوى التاريخي","قصر سبالة موضي","جامع الطريف الكبير","أبراج سمحة والفيصل","وادي حنيفة"],image:"https://images.unsplash.com/photo-1578895101407-33a7eb6d9539?auto=format&fit=crop&w=1200&q=80",curatorNote:"تتميز جدران قصر سلوى بسماكتها التي تصل إلى متر كامل، مع استخدام جذوع أثل ونخيل محلية وأفنية داخلية تؤمن تبريداً هوائياً طبيعياً ذكياً."},{id:"historic-jeddah",nameAr:"جدة التاريخية (البلد)",nameEn:"Historic Jeddah, the Gate to Makkah",region:"منطقة مكة المكرمة (جدة)",inscribedYear:2014,category:"ثقافي",brief:"ميناء الحرمين التاريخي على ساحل البحر الأحمر المشتهر برواشينه الخشبية البديعة ومنازله المبنية بالحجر المنقبي.",deepDescription:"منذ أن أمر الخليفة الراشد عثمان بن عفان رضي الله عنه بتحويلها إلى ميناء رئيسي لمكة المكرمة في عام 647م، أصبحت جدة ملتقى الثقافات والحجاج والتجار من كافة أرجاء المعمورة. تتميز البلد بأزقتها الضيقة ومنازلها البرجية التراثية المكسوة بالرواشين المصنوعة من خشب الساج الجاوي المنقوش، وأبوابها التاريخية العتيقة مثل باب مكة وباب شريف.",significance:["بوابة الحجاج والمعتمرين إلى مكة المكرمة عبر العصور الإسلامية.","طراز معماري فريد يستعمل الحجر الجيري المرجاني المقتطع من شواطئ البحر الأحمر وخشب الرواشين البديع.","حارة الشام واليمن والمظلوم والكرنتينة التي تختزل مئات السنين من التجارة الدولية والتنوع الثقافي."],historicalEra:"منذ العصر الراشدي والقرون الإسلامية حتى العهد السعودي",locationCoord:{lat:21.4858,lng:39.1866},features:["بيت نصيف التاريخي","بيت المتبولي","مسجد الشافعي العتيق","الرواشين الخشبية المحفورة","باب مكة وباب شريف"],image:"https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1200&q=80",curatorNote:"أقام الملك عبدالعزيز طيب الله ثراه في بيت نصيف عام 1925م عند دخوله جدة، وفي فنائه نمت أول شجرة في جدة المعاصرة نظراً لندرة المياه العذبة آنذاك."},{id:"rock-art-hail",nameAr:"الفنون الصخرية في منطقة حائل (جبة والشويمس)",nameEn:"Rock Art in the Hail Region",region:"منطقة حائل",inscribedYear:2015,category:"ثقافي",brief:"أكبر وأثرى مكتبة صخرية مفتوحة في الشرق الأوسط توثق حياة الإنسان والحيوان عبر 10,000 عام.",deepDescription:"يضم الموقع جبل أم سنمان في جبة وجبال المنجور ورطا في الشويمس. تغطي هذه الصخور نقوشاً إنسانية وحيوانية مذهلة تعود إلى العصر الحجري الحديث وما بعده، توثق تحول المناخ من بحيرات ومروج خضراء كانت ترعى فيها الأبقار والغزلان والوعول والخيول، وصولاً إلى عصر الجفاف واستئناس الجمال والكتابات الثمودية القديمة.",significance:["توثيق استثنائي للأنشطة الإنسانية والمعتقدات الصيدية على مدى عشرة آلاف سنة.","تجسيد دقيق للتغيرات المناخية والبيئية في شبه الجزيرة العربية.","تضم نقوشاً لأزياء رجالية ونسائية وتسريحات شعر وأسلحة صيد قديمة كالأقواس والسهام والعصي المقوسة."],historicalEra:"العصر الحجري الحديث والعصور البرونزية والحديدية",locationCoord:{lat:28.0069,lng:40.9422},features:["جبل أم سنمان بجبة","وادي المنجور بالشويمس","نقوش الأبقار والخيول بالحجم الطبيعي","الكتابات الثمودية الجبلية"],image:"https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=1200&q=80",curatorNote:"كان جبل أم سنمان يقع على ضفاف بحيرة مياه عذبة عملاقة جفت تدريجياً، تاركة وراءها هذا الأرشيف البصري الخالد."},{id:"al-ahsa-oasis",nameAr:"واحة الأحساء",nameEn:"Al-Ahsa Oasis, an Evolving Cultural Landscape",region:"المنطقة الشرقية",inscribedYear:2018,category:"ثقافي",brief:"أكبر واحة نخيل قائمة بذاتها في العالم، ومثال عبقري للتعايش المستدام بين الإنسان والبيئة الصحراوية.",deepDescription:"تحتضن واحة الأحساء أكثر من 2.5 مليون نخلة تغذيها مئات العيون المائية العذبة المتدفقة عبر شبكة قنوات ري تقليدية معقدة تطورت عبر آلاف السنين. يضم المشهد الثقافي للأحساء قنوات المياه، والعيون الحارة، والقرى التاريخية، وقصر إبراهيم الأثري، وجبل القارة بكهوفه الباردة صيفاً الدافئة شتاءً، ومسجد جواثى التاريخي الذي أقيمت فيه ثاني جمعة في الإسلام.",significance:["أكبر واحة نخيل محاطة بالرمال في العالم مسجلة بموسوعة غينيس لليونسكو.","نظام زراعي وهندسي مستمر منذ الألف الخام
